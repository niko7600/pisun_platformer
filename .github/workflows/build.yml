name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Python-зависимости
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3" virtualenv setuptools

      - name: Кэш buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Сборка APK
        run: buildozer -v android debug

      - name: Загрузка APK
        uses: actions/upload-artifact@v4
        with:
          name: pisun-apk
          path: bin/*.apk
